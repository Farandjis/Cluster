    <div id="section_module">
        <div id="section_form">
            <form class="module test">
                <input class="inputForm" type="number" placeholder="Argument 1">
                <input class="inputForm" type="number" placeholder="Argument 2">
                <input class="inputForm" type="number" placeholder="Argument 3">
                <div class="bouton_intput">
                    <input class="button" type="submit" value="Exécuter">
                    <input class="button" type="reset" value="Reset">
                </div>
            </form>
            <form class="module prime">
                <input class="inputForm" type="number" placeholder="Valeur de départ">

                    <input class="button" type="submit" value="Exécuter">

                </div>
            </form>
            <form class="module pi">
                <input class="inputForm" type="number" placeholder="Nombre de point">

                </div>
            </form>
            <form class="module fibonnaci">
                <input class="inputForm" type="number" placeholder="Argument 1">
