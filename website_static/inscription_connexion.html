<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion/Inscription</title>
    <link rel="stylesheet" href="style/navigation.css">
    <link rel="stylesheet" href="style/main_style.css">
    <link rel="stylesheet" href="style/inscription_connexion.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <link rel="icon" href="img/logo_icone.png" type="image/png">
</head>
<body>
<div id="return"><a href="index.html"><-</a></div>
<div id="body_inscription_connexion">
<div><img src="img/logo_origin_2.png" id="logoTitle" alt="Logo Paralix"></div>

<div class="container" id="container">
    <div class="form_container">
        <div class="form_inscription">
            <form action="tableau_bord.html">
                <h1>Créer un compte</h1>
                <label for="NomInsc">Nom</label>
                <input class="inputForm" type="text" placeholder="Nom" name="NomInsc" id="NomInsc" required>
                <label for="MdpInsc">Mot de passe</label>
                <input class="inputForm" type="password" placeholder="Mot de passe" name="MdpInsc" id="MdpInsc" required>
                <label for="ValidMdpInsc">Validation du mot de passe</label>
                <input class="inputForm" type="password" placeholder="Vérification Mot de Passe" name="ValidMdpInsc" id="ValidMdpInsc" required>
                <input class="button" type="submit" value="S'inscrire">
            </form>
        </div>
    </div>
    <div class="form_container">
        <div class="form_connexion">
            <form action="tableau_bord.html">
                <h1>Connectez-vous</h1>
                <label for="NomConnex">Nom</label>
                <input class="inputForm" type="text" placeholder="Nom" name="NomConnex" id="NomConnex" required>
                <label for="MdpConnex">Mot de Passe</label>
                <input class="inputForm" type="password" placeholder="Mot de passe" name="MdpConnex" id="MdpConnex" required>
                <input class="button" type="submit" value="Se Connecter">
            </form>
        </div>

    </div>


</div>
</div>
<script src="js/inscription_connexion.js" charset="utf-8"></script>
</body>
</html>
